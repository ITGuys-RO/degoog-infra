name: Build degoog-mcp image

on:
  push:
    branches: [main]
    paths:
      - 'degoog-mcp/**'
      - '.github/workflows/build-mcp.yml'
  workflow_dispatch:

concurrency:
  group: build-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Repo-scoped ARC scale set in the k3s cluster (DinD). The org-scoped
    # `arc-itguys-ro` set is registered but does not deliver assigned jobs
    # to its runner pods (runners spawn with exitCode 0 without claiming
    # the job). Until that's resolved, this repo stays on its own scale
    # set — same pattern as the dustfeather `arc-df-<repo>` sets.
    runs-on: arc-itguys-ro-degoog-infra
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/itguys-ro/degoog-mcp
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./degoog-mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
