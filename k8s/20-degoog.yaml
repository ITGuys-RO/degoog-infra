apiVersion: apps/v1
kind: Deployment
metadata:
  name: degoog
  namespace: degoog
  labels:
    app.kubernetes.io/name: degoog
    app.kubernetes.io/part-of: degoog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: degoog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: degoog
        app.kubernetes.io/part-of: degoog
    spec:
      enableServiceLinks: false
      # The upstream ghcr.io/fccview/degoog image runs Bun as PID 1 with no
      # init/subreaper. degoog shells out to `git` and does not reap the
      # children, so exited git processes pile up as <defunct> zombies that
      # nothing ever reaps. Sharing the process namespace makes the pod's
      # pause (infra) container PID 1; the pause container is a real init that
      # reaps zombies continuously. Single-container pod, so the usual
      # cross-container process-visibility caveat does not apply here.
      shareProcessNamespace: true
      nodeSelector:
        kubernetes.io/hostname: asus-laptop
      containers:
        - name: degoog
          image: ghcr.io/fccview/degoog:latest
          imagePullPolicy: Always
          env:
            - name: DEGOOG_DEFAULT_SEARCH_LANGUAGE
              value: ro
            - name: PUID
              value: "1002"
            - name: PGID
              value: "1002"
          ports:
            - name: http
              containerPort: 4444
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: degoog-data
---
apiVersion: v1
kind: Service
metadata:
  name: degoog
  namespace: degoog
  labels:
    app.kubernetes.io/name: degoog
    app.kubernetes.io/part-of: degoog
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: degoog
  ports:
    - name: http
      port: 4444
      targetPort: http
